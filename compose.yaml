services:

  # TODO: Rossado nao funciona com essa imagem de mongo
  mongodb:
    image: bitnami/mongodb:latest
    container_name: mongodb
    ports:
     - "27017:27017"
    environment:
      - MONGODB_ROOT_USER=keyhaven
      - MONGODB_ROOT_PASSWORD=keyhaven
      - MONGODB_DATABASE=keyhaven
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: backend
    pull_policy: build
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URL=mongodb://keyhaven:keyhaven@mongodb:27017
      - PORT=8080
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
